name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx standard src/ tests/ examples/

      - name: Type declarations check
        run: npm run check:types

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Integration tests (real Redis, includes reconnection)
        run: npm run test:integration

      # Examples are documentation that must keep working: each one asserts
      # its own outcome, so a broken promise fails the build.
      - name: Examples (real Redis)
        run: npm run examples

      - name: Build
        run: npm run build

      # Validate the artifact, not the repo: pack it, install it in a clean
      # project and import it through both module systems.
      - name: Verify the published package
        run: npm run verify:package

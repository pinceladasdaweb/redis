name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint, test & build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx standard src/ tests/ examples/

      - name: Type declarations check
        run: npm run check:types

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Integration tests (real Redis, includes reconnection)
        run: npm run test:integration

      # Examples are documentation that must keep working: each one asserts
      # its own outcome, so a broken promise fails the build.
      - name: Examples (real Redis)
        run: npm run examples

      - name: Build
        run: npm run build

      # Validate the artifact, not the repo: pack it, install it in a clean
      # project and import it through both module systems.
      - name: Verify the published package
        run: npm run verify:package

  # Cluster needs its own topology, so it gets its own job rather than a
  # service container: three masters that announce an address the runner can
  # reach, which is what makes MOVED/ASK resolvable from outside.
  # The Node matrix above catches runtime differences; this one catches server
  # differences, which are a separate axis — the unit tests never touch Redis,
  # so only the integration suite is worth repeating here. Crossing both axes
  # would be a dozen jobs to cover what 3 + 2 already cover.
  #
  # This exists because the README used to promise Redis >= 6.2 while CI only
  # ever ran 7.4, and the floor turned out to be 7.0: XAUTOCLAIM's third reply
  # field and the 'n' keyspace class both arrived in 7.0. Claiming a range and
  # testing one point in it is how that goes unnoticed.
  #
  # 7.4 is deliberately absent: the job above already runs the integration
  # suite against it on three Node versions.
  redis-versions:
    name: Integration on Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        redis: ['7.0-alpine', '8-alpine']
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      # The floor and the ceiling of what the README promises.
      - name: Integration tests
        run: npm run test:integration

  cluster:
    name: Cluster suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Start a three-master cluster
        run: docker compose -f docker-compose.cluster.yml up -d --wait

      - name: Wait for the cluster to converge
        run: |
          for attempt in $(seq 1 30); do
            state=$(docker run --rm --network host redis:7.4-alpine redis-cli -p 7001 cluster info | grep -o 'cluster_state:[a-z]*' || true)
            echo "attempt $attempt: $state"
            [ "$state" = "cluster_state:ok" ] && exit 0
            sleep 2
          done
          echo "the cluster never reached cluster_state:ok"
          exit 1

      - name: Cluster integration tests
        run: npm run test:cluster

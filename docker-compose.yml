services:
  redis:
    container_name: redis
    hostname: redis
    image: 'redis:7.4-alpine'
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
    driver: local
